<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mural de Fotos - iphotos</title>
  <!-- Link direcionado para o novo arquivo de estilo separado -->
  <link rel="stylesheet" href="evento.css">
  <script src="api-config.js"></script>
</head>
<body>

  <!-- HEADER -->
  <header class="meu-header">
    <a href="index.html" class="logo">
      <img src="assets/logo.png" alt="iphotos" class="logo-imagem" onerror="this.style.display='none'" onload="this.style.display='inline-block'; var t=document.getElementById('logo-texto'); if(t) t.style.display='none';">
      <span id="logo-texto">iphoto<span>s</span></span>
    </a>
    <nav class="menu-links">
      <a href="index.html">Voltar para a Vitrine</a>
      <a href="carrinho.html">🛒 Carrinho (<span id="contador-carrinho">0</span>)</a>
    </nav>
  </header>

  <!-- BANNER DO EVENTO SELECIONADO -->
  <section class="banner-evento" id="banner-evento">
    <h1 id="titulo-evento">Carregando evento...</h1>
    <p id="subtitulo-evento">Fotos protegidas por direitos autorais</p>
  </section>

  <!-- BUSCA POR NÚMERO DO COMPETIDOR (recurso visual — filtragem por número ainda não
       tem correspondência no backend; mantido como filtro de texto no título/local) -->
  <div class="barra-busca-atleta">
    <input type="text" placeholder="Buscar por número/descrição da foto" class="input-atleta" id="busca-foto" oninput="renderizarFotos()" />
    <button class="btn-busca-atleta" onclick="renderizarFotos()">Buscar</button>
  </div>

  <!-- VITRINE DE IMAGENS DISPONÍVEIS -->
  <div class="vitrine-fotos">
    <div class="grid-fotos" id="grid-fotos-dinamico">
      <p style="grid-column:1/-1; text-align:center; padding:40px; color:#64748b;">Carregando fotos...</p>
    </div>
  </div>

  <!-- LIGHTBOX: mostra a foto inteira, sem corte, ao clicar no card -->
  <div id="lightbox-overlay" onclick="fecharLightbox(event)"
    style="display:none; position:fixed; inset:0; background:rgba(15,23,42,0.9); z-index:999; align-items:center; justify-content:center; padding:24px;">
    <button type="button" onclick="fecharLightbox(event)"
      style="position:absolute; top:18px; right:24px; background:none; border:none; color:#fff; font-size:28px; cursor:pointer; line-height:1;">✕</button>
    <img id="lightbox-imagem" src="" alt="Foto ampliada" draggable="false" oncontextmenu="return false"
      style="max-width:90vw; max-height:88vh; object-fit:contain; -webkit-user-drag:none; user-select:none;">
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const eventoId = params.get('id');
    const CHAVE_CARRINHO = 'iphotos_carrinho';
    let fotosDoEvento = [];

    function getCarrinho() {
      return JSON.parse(localStorage.getItem(CHAVE_CARRINHO) || '[]');
    }

    function salvarCarrinho(itens) {
      localStorage.setItem(CHAVE_CARRINHO, JSON.stringify(itens));
      atualizarContadorCarrinho();
    }

    function atualizarContadorCarrinho() {
      document.getElementById('contador-carrinho').innerText = getCarrinho().length;
    }

    function adicionarAoCarrinho(foto) {
      const carrinho = getCarrinho();
      if (carrinho.some(f => f.id === foto.id)) {
        alert('Esta foto já está no seu carrinho.');
        return;
      }
      carrinho.push({ id: foto.id, preco: foto.preco, urlPublica: foto.urlPublica, eventoId });
      salvarCarrinho(carrinho);
      alert('Foto adicionada ao carrinho!');
    }

    function abrirLightbox(url) {
      document.getElementById('lightbox-imagem').src = url;
      document.getElementById('lightbox-overlay').style.display = 'flex';
    }

    function fecharLightbox(event) {
      // fecha clicando fora da imagem ou no X — não fecha se clicar na própria imagem
      if (event.target.id === 'lightbox-imagem') return;
      document.getElementById('lightbox-overlay').style.display = 'none';
      document.getElementById('lightbox-imagem').src = '';
    }

    function renderizarFotos() {
      const termo = (document.getElementById('busca-foto')?.value || '').toLowerCase();
      const grid = document.getElementById('grid-fotos-dinamico');
      const carrinho = getCarrinho();
      const lista = fotosDoEvento; // filtro visual simples (sem metadado de nº de atleta no backend ainda)

      if (!lista.length) {
        grid.innerHTML = '<p style="grid-column:1/-1; text-align:center; padding:40px; color:#64748b;">Nenhuma foto publicada para este evento ainda.</p>';
        return;
      }

      grid.innerHTML = lista.map(foto => `
        <div class="card-foto">
          <div class="wrapper-imagem" oncontextmenu="return false" style="user-select:none; -webkit-user-select:none;">
            <img src="${foto.urlPublica}" alt="Foto do evento" draggable="false" oncontextmenu="return false"
              style="width:100%; height:100%; object-fit:cover; pointer-events:none; -webkit-user-drag:none;">
            <div class="protecao-clique" oncontextmenu="return false" onclick="abrirLightbox('${foto.urlPublica}')" style="position:absolute; inset:0; cursor:zoom-in;"></div>
            <div class="marca-dagua">iphotos</div>
          </div>
          <div class="info-foto">
            <span class="preco-foto">R$ ${Number(foto.preco).toFixed(2).replace('.', ',')}</span>
            <button class="btn-carrinho" onclick='adicionarAoCarrinho(${JSON.stringify(foto)})' ${carrinho.some(f => f.id === foto.id) ? 'disabled' : ''}>
              ${carrinho.some(f => f.id === foto.id) ? 'No carrinho ✓' : 'Comprar'}
            </button>
          </div>
        </div>
      `).join('');
    }

    async function carregarEvento() {
      if (!eventoId) {
        document.getElementById('titulo-evento').innerText = 'Evento não informado.';
        return;
      }
      try {
        const resp = await fetch(`${API_URL}/eventos/${eventoId}`);
        const evento = await resp.json();
        if (!resp.ok) throw new Error(evento.erro || 'Evento não encontrado.');

        document.getElementById('titulo-evento').innerText = evento.titulo;
        document.getElementById('subtitulo-evento').innerText =
          `${evento.local} • Cobertura por ${evento.fotografo?.nome || 'iphotos'} • Fotos protegidas por direitos autorais`;

        fotosDoEvento = evento.fotos || [];
        renderizarFotos();
      } catch (err) {
        document.getElementById('titulo-evento').innerText = 'Não foi possível carregar este evento.';
        console.error(err);
      }
    }

    window.onload = () => {
      atualizarContadorCarrinho();
      carregarEvento();
    };
  </script>

</body>
</html>
